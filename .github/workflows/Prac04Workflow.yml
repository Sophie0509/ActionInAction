# CP5401 Practical 04
# Learning GitHub Actions workflow syntax

name: Practical 04 Workflow

on:
  push:
    branches:
      -main
  pull_request:
    branches:
      -main
  workflow_dispatch:

jobs:
  job_1:
    runs-on: ubuntu-latest
    steps:
      - name: Run Job 1
        run: echo "Job 1 completed"

  job_2:
    runs-on: ubuntu-latest
    needs: job_1
    steps:
      - name: Run Job 2
        run: echo "Job 2 runs after Job 1"

  job_3:
    runs-on: ubuntu-latest
    needs: job_1
    steps:
      - name: Run Job 3
        run: 
          echo "Job 3 also runs after Job 1"
          echo "This is a multi-line script"

  job_4:
    runs-on: ubuntu-latest
    needs: [job_2, job_3]
    steps:
      - name: Run Final Job
        run: echo "Job 4 runs after Job 2 and Job 3"
        
